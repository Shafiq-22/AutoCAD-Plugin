name: CI

# The build is split by what each platform can actually do.
#
# The platform-neutral layers - the domain model, the section database, the geometry, the bill of
# materials and the Excel writer - build and test anywhere, so they run on Linux where agents are
# cheapest and fastest. That is also where the whole test suite lives.
#
# The AutoCAD and WPF layers need Windows: WPF cannot be compiled anywhere else, and the AutoCAD
# reference assemblies are Windows-targeted. Those jobs prove the plugin compiles against each
# supported AutoCAD release and assemble the installable bundle.
#
# No Autodesk binary is committed to this repository or published by this workflow. The AutoCAD.NET
# packages restore from nuget.org, where Autodesk publishes them, and they are referenced with
# ExcludeAssets="runtime" so they are used to compile against and never copied into the output.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:

  # ---------------------------------------------------------------------------
  # Everything that does not need AutoCAD, including the entire test suite.
  # ---------------------------------------------------------------------------
  core:
    name: Core and tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore StructureGen.Portable.slnf

      - name: Build
        run: dotnet build StructureGen.Portable.slnf -c Release --no-restore

      # The portable solution filter includes StructureGen.CompileCheck, which puts the AutoCAD and
      # user-interface sources through the compiler against stand-in AutoCAD and WPF types. That
      # means their calls into StructureGen's own code are verified on this job, hours before the
      # Windows jobs get a chance to compile them for real.

      - name: Test
        run: >
          dotnet test tests/StructureGen.Tests
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Validate the shipped section database
        run: >
          dotnet run --project src/StructureGen.Tools.DataImport -c Release --no-build --
          validate --in data/structural-sections.json

      - name: Validate the shipped imperial dataset
        run: >
          dotnet run --project src/StructureGen.Tools.DataImport -c Release --no-build --
          validate --in data/structural-sections-imperial-demo.json

      - name: Validate the compiled AISC dataset
        run: >
          dotnet run --project src/StructureGen.Tools.DataImport -c Release --no-build --
          validate --in data/aisc-sections.json

      # The section data is compiled from pinned sources rather than hand written, so
      # the committed files have to be what the compiler currently produces. Re-running it and
      # finding a difference means someone edited the output instead of the compiler, or an
      # upstream package moved - either way it needs looking at rather than merging.
      - name: Recompile the section data and check it is unchanged
        run: |
          python3 tools/data-sources/compile_sections.py --download
          git diff --exit-code -- data/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # One job per supported AutoCAD release. A failure here means that release's
  # API has changed in a way the source no longer matches.
  # ---------------------------------------------------------------------------
  plugin:
    name: AutoCAD ${{ matrix.acad }} plugin (Windows)
    runs-on: windows-latest
    needs: core

    strategy:
      fail-fast: false
      matrix:
        include:
          # AutoCAD 2025 is release R25.0 and hosts .NET 8.
          - acad: '2025'
            dotnet: '8.0.x'
          # AutoCAD 2026 is R25.1. It shipped on .NET 8 and a later update moved to .NET 10;
          # building against the lower one means the single binary serves both.
          - acad: '2026'
            dotnet: '8.0.x'
          # AutoCAD 2027 is R26.0 and hosts .NET 10.
          - acad: '2027'
            dotnet: '10.0.x'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            ${{ matrix.dotnet }}

      - name: Publish the plugin
        run: >
          dotnet publish src/StructureGen.Acad/StructureGen.Acad.csproj
          -c Release
          -p:AcadVersion=${{ matrix.acad }}
          -p:DebugType=portable
          -o artifacts/bundle/Contents/${{ matrix.acad }}

      - name: Check that no Autodesk assembly was redistributed
        shell: pwsh
        run: |
          # AutoCAD loads its own copies. Shipping a second copy beside the plugin stops it loading,
          # and would also redistribute Autodesk binaries this project has no licence to ship.
          $output = "artifacts/bundle/Contents/${{ matrix.acad }}"
          $found = @(Get-ChildItem $output -Filter 'Ac*.dll' -ErrorAction SilentlyContinue) +
                   @(Get-ChildItem $output -Filter 'Ad*.dll' -ErrorAction SilentlyContinue)
          if ($found.Count -gt 0) {
              $names = ($found | Select-Object -ExpandProperty Name) -join ', '
              Write-Error "Autodesk assemblies were copied into the output: $names"
              exit 1
          }
          Write-Host "No Autodesk assemblies in the output. Good."

      - name: Upload the release build
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.acad }}
          path: artifacts/bundle/Contents/${{ matrix.acad }}

  # ---------------------------------------------------------------------------
  # Assemble the three release builds, the data and the documentation into the
  # single installable bundle.
  # ---------------------------------------------------------------------------
  bundle:
    name: Assemble the installable bundle
    runs-on: ubuntu-latest
    needs: plugin

    steps:
      - uses: actions/checkout@v4

      - name: Download the release builds
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: downloaded

      - name: Lay out the bundle
        run: |
          set -euo pipefail

          bundle="artifacts/StructureGen.bundle"
          mkdir -p "$bundle/Contents"

          for version in 2025 2026 2027; do
            if [ -d "downloaded/plugin-$version" ]; then
              mkdir -p "$bundle/Contents/$version"
              cp -r "downloaded/plugin-$version/." "$bundle/Contents/$version/"
            fi
          done

          cp build/PackageContents.xml "$bundle/"

          mkdir -p "$bundle/Contents/Data" "$bundle/Contents/Docs"
          cp -r data/. "$bundle/Contents/Data/"
          cp -r docs/. "$bundle/Contents/Docs/"
          cp README.md LICENSE "$bundle/Contents/Docs/"

          echo "Bundle contents:"
          find "$bundle" -type f | sort

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: StructureGen.bundle
          path: artifacts/StructureGen.bundle
